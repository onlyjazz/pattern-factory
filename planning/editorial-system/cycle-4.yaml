  title: Review dry-run quality sample
  type: validate
  project: editorial-system
  cycle: cycle-4
  priority: urgent
  estimate: 5
  labels:
  - editorial
  - human
  - qa
  execution:
    executor: warp-agent
    agent_template: validate
    parallel_group: c4-review
    reviewer: Danny
    review_required: full
  depends_on:
  - DR-402
  - ED-212
  objective: Measure quality across the production batch.
  context: Generation success alone does not prove executive usefulness.
