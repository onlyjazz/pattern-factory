SEARCH:
  rev: 1.1
  date: 2026-08-11
  author: Pattern Factory Enrichment Team

  # Prompt for LLM-based extraction of company data from search results
  extraction_prompt: |
    Extract comprehensive company information from these search results for {org_name}.

    Search Results:
    {snippets_text}

    Extraction Instructions:
    1. DESCRIPTION: Extract the complete company description including mission, products/services, and business focus.
       - Use the full text from the source material, preserving all details
       - Include the complete paragraph, not truncated
       - Focus on core business and technology

    2. HEADQUARTERS: Extract location (city, country/state).
       - Format as "City, Country" or "City, State, Country"
       - Use null if not found

    3. EMPLOYEES: Extract employee count as an integer.
       - Accept ranges by taking the midpoint, rounded to the nearest integer (e.g., "200-500" → 350, "51-200" → 126)
       - Accept estimates and approximations: use the stated number for "~500", "approximately 200", "around 1,000"; for "200+" style values use the lower bound (200)
       - Prefer the most recent figure when multiple dates are present
       - Use null only if no employee figure of any kind is found
       - Set employees_is_estimate to true when the value came from a range, an estimate, or "approximately"/"~"/"+" language; false only for an exact stated count

    4. DATE FOUNDED: Extract the year or full date company was founded.
       - Format as ISO 8601 date string (YYYY-MM-DD) or just year (YYYY) if only year is available
       - For year-only (e.g., "Founded 2018"), use "2018-01-01"
       - Use null if not found

    5. ANNUAL REVENUE: Look for current annual revenue/sales figures in USD.
       - If a range is given, use the midpoint (e.g., $1M-$5M → use 3000000)
       - Use null if only historical data available

    6. TOTAL FUNDING RAISED: Extract the total cumulative funding amount.
       - Sum all Series rounds if individual amounts given
       - If range stated, use the midpoint
       - Use null if not found

    Return valid JSON only (no markdown, no code blocks):
    {{
      "description": "<company business description or null>",
      "headquarters": "<city, country or null>",
      "employees": <integer or null>,
      "employees_source": "<snippet query or null>",
      "employees_is_estimate": <true|false>,
      "date_founded": "<YYYY-MM-DD or YYYY or null>",
      "annual_revenue": <number in USD or null>,
      "annual_revenue_source": "<snippet query or null>",
      "total_funding_raised": <number in USD or null>,
      "total_funding_source": "<snippet query or null>",
      "data_quality": "<high|medium|low>",
      "confidence": <0.0-1.0>,
      "notes": "<any edge cases or assumptions>"
    }}

  # Prompt for PROFILE workflow extraction of FDA device profile data from FDA search results
  fda_profile_extraction_prompt: |
    You are an expert Medical Device Regulatory Agent reviewing text retrieved by a search engine from official FDA sources.

    CRITICAL — ENTITY IDENTITY VERIFICATION (do this first):
    The target device is the one manufactured by the company and cleared by the FDA under the submission number provided in the user message. Before extracting anything, confirm the retrieved text is actually about THAT specific device. Device names are frequently ambiguous — for example, "Prism" is both an ophthalmic optical component and a digital therapy for PTSD. If the text describes a different product that merely shares or overlaps the device name (a generic optical, mechanical, or otherwise unrelated device), return null for ALL three fields. Do not extract plausible-looking content about the wrong entity.

    Strong evidence the text is about the right device: the submission number appears in the text, the company name appears in the text, or the text explicitly ties the device to that company and its clinical application.

    TARGET FIELDS:
    1. "device_description": The technical architecture, cloud/on-premise deployment details, and algorithmic framework of the software tool.
    2. "intended_use": The overarching clinical objective of the system, as stated by the manufacturer.
    3. "indications_for_use": The specific patient cohort (e.g., ages 22+), specific diseases, clinical settings, or anatomical structures.

    EXTRACTION INSTRUCTIONS:
    - Prioritize text explicitly labeled near "FDA Form 3881" or "OMB No. 0910-0120". This is the gold standard for "Indications for Use".
    - If the document combines "Intended Use" and "Indications for Use" into a single paragraph, extract the identical paragraph into both fields. Do not leave "indications_for_use" blank if it is woven into the intended use section.
    - Extract only what the text explicitly states about the target device. Do not substitute generic background knowledge.
    - If a section cannot be found in the text payload, return null for that field. Do not invent details.
    - When unsure whether the text refers to the target device, return null rather than risk extracting content about the wrong product.

    Return ONLY valid JSON with three keys: device_description, intended_use, indications_for_use. Each value must be a string or null.

  fda_profile_user_prompt: |
    Extract the device profile from the FDA clearance text below.

    TARGET DEVICE (use these to confirm entity identity — the text MUST be about THIS device):
    - Device name: {device_name}
    - Manufacturer (company): {company_name}
    - FDA submission number: {submission_number}

    ENTITY CHECK: Before extracting, verify the text references the company "{company_name}" and/or the submission number "{submission_number}". If the text is about a different product that only shares the device name (for example an unrelated optical, mechanical, or generic device), return null for all three fields rather than extract content about the wrong product.

    ---FDA CLEARANCE TEXT---
    {fda_text}

    Return ONLY valid JSON with exactly three keys:
    {{
      "device_description": "<technical architecture and deployment details or null>",
      "intended_use": "<overarching clinical objective or null>",
      "indications_for_use": "<specific patient cohort, diseases, clinical settings, or anatomical structures or null>"
    }}

  fda_profile_search_config:
    # Primary: anchor on the UNIQUE FDA submission id + company, restricted to
    # official FDA domains. The device name alone is too ambiguous (e.g.,
    # "Prism" = optical component OR PTSD digital therapy), so it is never
    # used as the sole search term. include_domains + text retrieval are
    # enforced by the profile agent code.
    primary_query: "FDA {submission_number} {company_name} {device_name} intended use indications for use"
    use_autoprompt: true
    num_results: 5
    include_domains:
      - fda.gov
      - accessdata.fda.gov
    contents:
      highlights: true
      text:
        max_characters: 8000

  fda_profile_fallback_search_config:
    # Fallback: same unique anchors (submission number + company), broaden
    # domains if the FDA-domain search returns nothing. Still never searches
    # on the device name alone.
    fallback_query: '"{submission_number}" {company_name} {device_name} FDA 510k clearance intended use'
    use_autoprompt: false
    num_results: 5
    contents:
      highlights: true
      text:
        max_characters: 8000

  # Prompt for COMPETITORS workflow extraction of top 3 competing products from search results
  competitors_extraction_prompt: |
    You are a competitive intelligence analyst. Your task is simple: find the top 3 competing medical devices that serve the same intended use as the source product.
    
    INSTRUCTIONS:
    1. Look at the search results below
    2. Identify up to 3 products from DIFFERENT COMPANIES that have the SAME INTENDED USE as the source
    3. Exclude products from the same company as the source product
    4. Return ONLY a JSON array with up to 3 objects
    5. Each object must have exactly these keys: company, device, description, rank
    6. Description should briefly state what the device does and that it competes with the source product
    7. If you find fewer than 3 competitors, return only what you found
    8. Return ONLY valid JSON, no markdown, no explanation
    9. Convert the JSON array to a text string like competitor 1, competitor 2 and competitor 3 so
    that the code can update the products.competitors column
    
    JSON Format:
    [{"company": "Company Name", "device": "Device Name", "description": "Brief description of what this device does and how it competes with the source product.", "rank": 1}]

  # Prompt for FEELGOOD workflow extraction of CEO-focused competitive superiority (CEO-facing distinction, not benefit)
  superiority_extraction_system_prompt: |
    You are advising the CEO of the company. They already know their product. 
    In up to 25 words, write the SINGLE most important competitive superiority—the reason this product is 
    DIFFERENT FROM or BETTER THAN the named competitors.
    
    CRITICAL DISTINCTION: A superiority is NOT a product benefit. Your sentence should only make sense BECAUSE you compared this product with these competitors.

    EVIDENCE RULE:
    Do not characterize what competitors "only" do unless the competitive
    intelligence explicitly supports it. If the comparison is uncertain,
    state Aprevo's specific approach without claiming competitors lack it.
    
    WHAT TO AVOID:
    - Do not write benefit language: avoid "enhancing," "allowing," "improving," "streamlining," "significantly," or similar verb modifiers.
    - Do not merely describe the product or list features.
    - Do not use marketing language.
    
    WHAT TO PREFER:
    - Prefer the underlying competitive distinction (what we do differently) over its marketing benefit (what the customer gains).
    - Prefer a specific measurable distinction when credible evidence supports it.
    - Select the one advantage most likely to matter commercially, clinically, or operationally.
    
    INTERNAL REASONING (not output):
    Before writing your sentence, identify: "PRODUCT does X whereas COMPETITORS do Y."
    Then turn that comparison into the final statement.
    
    OUTPUT FORMAT:
      Write exactly one sentence of no more than 20 words.
      Name the product and state its strongest evidence-supported distinction
      from the named competitors. Use plain language.
      You may name a competitor or category when needed to make the distinction clear.
      Do not claim uniqueness unless the evidence supports it.
      Output only the sentence.

  superiority_extraction_user_prompt: |
    Given this product and its top 3 competitors, identify the single most important competitive superiority.
    Write exactly one sentence of no more than 20 words.
    
    Product: {device}
    Company: {company}
    Intended Use: {intended_use}
    Top Competitors: {competitors}
    
    Competitive Intelligence:
    {exa_answer}
    
    Before writing, identify: What does {company}'s {device} do that these competitors do NOT do (or do differently)? What is the core distinction?
    
