tasks:
  - plan_key: PF-101
    title: Audit current Pattern Factory pipeline
    type: inspect
    objective: Document the current report-generation flow and identify reliability gaps.
    acceptance_criteria:
      - Architecture map names all stages
      - Defects are ranked by severity and blocking impact
      - Unknowns are explicitly listed
    artifacts:
      - The required output described above
      - Tests or validation evidence
      - A completion report tied to every acceptance criterion
      - Updated documentation where behavior, schema, prompts, or operations change
    warp_prompt: |
      # Inspection Task

      Do not modify production code unless explicitly requested. Trace actual behavior from code and runtime evidence. Separate verified facts, assumptions, defects, and unknowns. Produce artifacts downstream agents can consume.
  - plan_key: PF-102
    title: Freeze report entity schema
    type: design
    objective: Define the stable entities and fields required for production reports.
    acceptance_criteria:
      - Schema covers company, device, assets, threats, countermeasures and report artifacts
      - No required field is ambiguous
      - Backward compatibility plan exists
    artifacts:
      - The required output described above
      - Tests or validation evidence
      - A completion report tied to every acceptance criterion
      - Updated documentation where behavior, schema, prompts, or operations change
    depends_on:
      - PF-101
    warp_prompt: |
      # Engineering Task

      Implement the requested change with the smallest coherent patch. Add or update automated tests. Run relevant migrations and tests. Avoid unrelated refactoring. Return exact files changed and commands run.
  - plan_key: PF-103
    title: Implement schema migration
    type: implement
    objective: Apply the frozen report schema to the database.
    acceptance_criteria:
      - Migration succeeds on clean and populated databases
      - Rollback succeeds
      - Models match schema
      - Tests pass
    artifacts:
