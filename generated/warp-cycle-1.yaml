cycle: cycle-1
name: Cycle 1 — Production Pipeline
goal: Generate production-quality reports end to end and qualify 3 unattended runs.
starts_at: '2026-08-02'
ends_at: '2026-08-08'
execution_policy:
  start_unblocked_groups_in_parallel: true
  stop_on_failed_gate: true
  human_review_at_cycle_gate: true
  cycle_gate:
    reviewer: Danny
    criteria:
      - All blocking tasks completed
      - Validation evidence attached
      - Remaining blockers explicitly accepted or moved
      - Next cycle dependencies unblocked
